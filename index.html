<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Простий вебзастосунок для керування списком справ">
  <title>Список справ — TODO App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container app-container">
    <section class="todo-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">Плануй свій день</p>
          <h1>Список справ</h1>
          <p class="subtitle">Усі важливі завдання — в одному місці.</p>
        </div>
        <div class="header-icon" aria-hidden="true">✓</div>
      </header>

      <div class="counter-row" aria-live="polite">
        <div class="counter">
          <span class="counter-number" id="item-count">0</span>
          <span class="counter-label">Усього справ</span>
        </div>
        <div class="counter">
          <span class="counter-number" id="unchecked-count">0</span>
          <span class="counter-label">Залишилося</span>
        </div>
      </div>

      <form id="todo-form" class="add-form">
        <label class="visually-hidden" for="todo-input">Нова справа</label>
        <input id="todo-input" class="form-control" type="text"
               placeholder="Наприклад, виконати лабораторну..." maxlength="160"
               autocomplete="off" required>
        <button class="btn btn-primary" type="submit">Додати справу</button>
      </form>

      <div class="list-heading">
        <h2>Мої завдання</h2>
        <span id="empty-hint" class="empty-hint">Додай першу справу</span>
      </div>
      <ul id="todo-list" class="list-group" aria-label="Список справ"></ul>

      <footer class="app-footer">
        <span>Дані автоматично зберігаються у цьому браузері</span>
        <button id="clear-completed" class="btn btn-link btn-sm" type="button">Очистити виконані</button>
      </footer>
    </section>
    <p class="page-note">Лабораторна робота №18 · HTML, CSS та JavaScript</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
